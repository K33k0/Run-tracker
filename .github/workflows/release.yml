name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$RELEASE_REF_TYPE" = tag || { echo 'Run this workflow from a version tag, not a branch.'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release tags must point to a commit on main.'; exit 1; }
          python3 scripts/release_version.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  checks:
    needs: version
    uses: ./.github/workflows/android.yml
  secret-scan:
    needs: version
    uses: ./.github/workflows/secrets.yml
  publish:
    needs: [version, checks, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_NAME: ${{ needs.version.outputs.name }}
      RELEASE_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          encoded = os.environ.get('KEYSTORE_BASE64', '')
          if not encoded:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is not configured')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runzone-signing'
          directory.mkdir(mode=0o700, exist_ok=True)
          key = directory / 'release.p12'
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RUNZONE_KEYSTORE_PATH={key}\n')
          PY
      - name: Build signed production APK
        env:
          RUNZONE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUNZONE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUNZONE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew --no-daemon assembleRelease lintRelease \
            -PreleaseVersion="$RELEASE_NAME" -PreleaseVersionCode="$RELEASE_CODE"
      - name: Verify signature, version and production settings
        run: |
          python3 scripts/verify_release.py app/build/outputs/apk/release/app-release.apk \
            --name "$RELEASE_NAME" --code "$RELEASE_CODE" \
            --certificate signing/release-certificate.sha256 \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/RunZone-$RELEASE_TAG.apk"
          cp signing/release-certificate.sha256 dist/signing-certificate.sha256
          (cd dist && sha256sum "RunZone-$RELEASE_TAG.apk" > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Refusing to replace an already published release")' "$RUNNER_TEMP/existing-release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "RunZone $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/runzone-signing/release.p12"
