name: Secret scan
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          SCAN_DIR="$RUNNER_TEMP/runzone-secret-scan"
          mkdir -p "$SCAN_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$SCAN_DIR/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$SCAN_DIR/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$SCAN_DIR/gitleaks.tar.gz" -C "$SCAN_DIR" gitleaks
          "$SCAN_DIR/gitleaks" git --redact --log-opts="--all" .
