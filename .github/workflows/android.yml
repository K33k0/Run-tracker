name: Android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: bash ./gradlew testDebugUnitTest assembleDebug lintDebug
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/broker.test.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: RunZone-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  screenshots:
    # Runs the app on an emulator with sample runs, checks the main screens render, and saves screenshots.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            status=0; bash ./gradlew connectedDebugAndroidTest || status=$?; mkdir -p screenshots; adb pull /sdcard/Android/data/com.runzone/files/screenshots screenshots/ || true; exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RunZone-screenshots
          path: |
            screenshots/
            app/build/reports/androidTests/
          if-no-files-found: ignore
